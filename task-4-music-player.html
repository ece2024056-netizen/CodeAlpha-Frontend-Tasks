<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterglow — Music Player</title>
<style>
:root{--bg:#101019;--panel:#1a1928;--panel2:#242239;--line:#ffffff17;--text:#f7f5ff;--muted:#aaa8bf;--accent:#d6f475;--warm:#ffb676}
*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 10%,#5c428a88,transparent 29rem),radial-gradient(circle at 85% 90%,#8f533f77,transparent 26rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.player{width:min(100%,1040px);min-height:630px;display:grid;grid-template-columns:300px 1fr;overflow:hidden;border:1px solid var(--line);border-radius:26px;background:#171625e6;box-shadow:0 32px 90px #0008;backdrop-filter:blur(18px)}
.sidebar{padding:27px 19px;border-right:1px solid var(--line);background:#11111c88}.logo{padding:0 10px;font-family:Georgia,serif;font-size:26px;font-style:italic;letter-spacing:-.06em}.logo span{color:var(--accent)}.playlist-title{margin:44px 10px 12px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.playlist{display:grid;gap:5px}.track{width:100%;display:grid;grid-template-columns:37px 1fr 29px;gap:10px;align-items:center;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--text);cursor:pointer;text-align:left;transition:background-color .18s}.track:hover,.track.active{background:#ffffff12}.track.active{color:var(--accent)}.track-num{font-size:12px;font-weight:750}.track-name{min-width:0}.track-name strong,.track-name span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-name strong{font-size:13px}.track-name span{margin-top:2px;color:var(--muted);font-size:11px}.track-time{color:var(--muted);font-size:11px}.note{position:relative;margin:31px 10px 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:var(--muted);font-size:12px;line-height:1.5}.note b{display:block;margin-bottom:3px;color:var(--text);font-size:12px}
.stage{display:flex;flex-direction:column;min-width:0;padding:32px 42px}.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.live{display:flex;align-items:center;gap:7px;color:var(--accent)}.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.now{display:grid;grid-template-columns:minmax(250px,370px) 1fr;gap:55px;align-items:center;flex:1;padding:33px 0}.cover{position:relative;aspect-ratio:1;overflow:hidden;border-radius:17px;background:linear-gradient(135deg,#ffcb78,#ad536e 54%,#30254c);box-shadow:0 20px 50px #0006;isolation:isolate}.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;filter:blur(1px)}.cover::before{width:70%;height:70%;left:-13%;bottom:-13%;background:#fedb9c}.cover::after{width:55%;height:55%;right:-5%;top:-5%;background:#503a85}.cover .disc{position:absolute;inset:23%;border:1px solid #fff7;border-radius:50%;background:repeating-radial-gradient(circle,#1b1834 0 2px,#312b52 3px 5px);box-shadow:inset 0 0 25px #0008}.cover .disc::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--accent);box-shadow:0 0 0 8px #ffffff18}.cover.theme-1{background:linear-gradient(135deg,#c4e67a,#44736a 51%,#1d354f)}.cover.theme-2{background:linear-gradient(135deg,#df7a91,#703d7d 53%,#242545)}.cover.theme-3{background:linear-gradient(135deg,#dfb15a,#b96540 48%,#572e3e)}
.meta .eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.meta h1{margin:12px 0 5px;font-family:Georgia,serif;font-size:clamp(38px,5vw,60px);font-weight:400;letter-spacing:-.065em;line-height:.97}.artist{margin:0;color:var(--muted);font-size:17px}.progress-area{margin-top:43px}.bar{width:100%;height:5px;margin:0;accent-color:var(--accent);cursor:pointer}.times{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;gap:16px;margin-top:27px}.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;font-size:22px}.icon-btn:hover{background:#ffffff12}.play{width:62px;height:62px;border:0;border-radius:50%;background:var(--accent);color:#182015;cursor:pointer;font-size:24px;box-shadow:0 10px 25px #d6f47533;transition:transform .18s,background-color .18s}.play:hover{transform:scale(1.06);background:#e4fa9c}.volume{display:flex;align-items:center;gap:9px;margin-left:auto;color:var(--muted);font-size:17px}.volume input{width:90px;accent-color:var(--accent);cursor:pointer}.autoplay{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.autoplay label{display:flex;align-items:center;gap:9px;cursor:pointer}.autoplay input{accent-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:760px){.player{grid-template-columns:1fr;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.playlist-title{margin-top:24px}.playlist{grid-template-columns:repeat(2,minmax(0,1fr))}.note{display:none}.stage{padding:26px}.now{grid-template-columns:180px 1fr;gap:28px;padding:28px 0}.progress-area{margin-top:28px}}@media(max-width:510px){body{padding:10px}.player{border-radius:18px}.sidebar{padding:20px 14px}.playlist{grid-template-columns:1fr}.stage{padding:22px 18px}.now{grid-template-columns:1fr;gap:25px}.cover{width:min(100%,300px);justify-self:center}.meta{text-align:center}.progress-area{margin-top:25px}.controls{justify-content:center}.volume{display:none}.topline{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="player" aria-label="Afterglow music player">
<aside class="sidebar"><div class="logo">after<span>glow</span>.</div><p class="playlist-title">Tonight's rotation</p><div class="playlist" id="playlist"></div><div class="note"><b>Made for focus</b>These original ambient tones are generated in-browser, so the player works without external media files.</div></aside>
<section class="stage"><div class="topline"><span>Now playing</span><span class="live"><i></i><span id="status">Paused</span></span></div><div class="now"><div class="cover" id="cover" aria-hidden="true"><div class="disc"></div></div><div class="meta"><div class="eyebrow">Afterglow Sessions</div><h1 id="title">Northern Light</h1><p class="artist" id="artist">Mira Vale</p><div class="progress-area"><input id="progress" class="bar" type="range" min="0" max="100" value="0" aria-label="Track progress"><div class="times"><span id="elapsed">0:00</span><span id="duration">2:48</span></div></div><div class="controls"><button type="button" class="icon-btn" id="previous" aria-label="Previous track">‹</button><button type="button" class="play" id="play" aria-label="Play">▶</button><button type="button" class="icon-btn" id="next" aria-label="Next track">›</button><div class="volume"><span>◖</span><input id="volume" type="range" min="0" max="100" value="62" aria-label="Volume"><span>◗</span></div></div><div class="autoplay"><label><input id="autoplay" type="checkbox" checked> Continue with the next track automatically</label></div></div></div></section>
</main>
<script>
(()=>{'use strict';
const tracks=[
{title:'Northern Light',artist:'Mira Vale',duration:168,root:220,type:'sine',theme:'theme-0'},
{title:'Low Tide',artist:'Noah West',duration:194,root:174.61,type:'triangle',theme:'theme-1'},
{title:'Velvet Hours',artist:'Elio June',duration:211,root:261.63,type:'sine',theme:'theme-2'},
{title:'Slow Bloom',artist:'Arden Lee',duration:186,root:196,type:'triangle',theme:'theme-3'}
];
const playlist=document.querySelector('#playlist'),title=document.querySelector('#title'),artist=document.querySelector('#artist'),cover=document.querySelector('#cover'),progress=document.querySelector('#progress'),elapsed=document.querySelector('#elapsed'),duration=document.querySelector('#duration'),play=document.querySelector('#play'),status=document.querySelector('#status'),volume=document.querySelector('#volume'),auto=document.querySelector('#autoplay');
let index=0,playing=false,position=0,startedAt=0,timer=null,ctx=null,master=null,voices=[];
const time=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function drawList(){playlist.innerHTML='';tracks.forEach((track,i)=>{const button=document.createElement('button');button.type='button';button.className='track'+(i===index?' active':'');button.innerHTML='<span class="track-num">'+String(i+1).padStart(2,'0')+'</span><span class="track-name"><strong>'+track.title+'</strong><span>'+track.artist+'</span></span><span class="track-time">'+time(track.duration)+'</span>';button.addEventListener('click',()=>select(i,true));playlist.append(button)})}
function paint(){const track=tracks[index];title.textContent=track.title;artist.textContent=track.artist;duration.textContent=time(track.duration);cover.className='cover '+track.theme;progress.max=track.duration;progress.value=position;elapsed.textContent=time(position);play.textContent=playing?'Ⅱ':'▶';play.setAttribute('aria-label',playing?'Pause':'Play');status.textContent=playing?'Playing':'Paused';drawList()}
function audio(){if(ctx)return;ctx=new AudioContext();master=ctx.createGain();master.gain.value=Number(volume.value)/100*.16;master.connect(ctx.destination)}
function stopSound(){voices.forEach(voice=>{try{voice.stop()}catch(e){}});voices=[]}
function startSound(){audio();ctx.resume();stopSound();const track=tracks[index];const gain=ctx.createGain();gain.gain.setValueAtTime(.7,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.2);gain.connect(master);[track.root,track.root*1.5,track.root*.5].forEach((frequency,i)=>{const oscillator=ctx.createOscillator();oscillator.type=i===1?'sine':track.type;oscillator.frequency.value=frequency;oscillator.connect(gain);oscillator.start();voices.push(oscillator)})}
function finish(){playing=false;clearInterval(timer);timer=null;stopSound();paint()}
function tick(){if(!playing)return;position=Math.min(tracks[index].duration,position+(ctx.currentTime-startedAt));startedAt=ctx.currentTime;paint();if(position>=tracks[index].duration){finish();if(auto.checked)select(index+1,true)}}
function begin(){if(playing)return;startSound();startedAt=ctx.currentTime;playing=true;timer=setInterval(tick,250);paint()}
function pause(){if(!playing)return;tick();playing=false;clearInterval(timer);timer=null;stopSound();paint()}
function select(next,autostart){pause();index=(next+tracks.length)%tracks.length;position=0;paint();if(autostart)begin()}
function nextTrack(){select(index+1,true)}function previousTrack(){if(position>4){position=0;if(playing)startedAt=ctx.currentTime;paint()}else select(index-1,true)}
play.addEventListener('click',()=>playing?pause():begin());document.querySelector('#next').addEventListener('click',nextTrack);document.querySelector('#previous').addEventListener('click',previousTrack);
progress.addEventListener('input',()=>{position=Number(progress.value);elapsed.textContent=time(position);if(playing)startedAt=ctx.currentTime});
volume.addEventListener('input',()=>{if(master)master.gain.value=Number(volume.value)/100*.16});
document.addEventListener('keydown',event=>{if(event.target.tagName==='INPUT')return;if(event.code==='Space'){event.preventDefault();playing?pause():begin()}else if(event.key==='ArrowRight')nextTrack();else if(event.key==='ArrowLeft')previousTrack()});
paint()})();
</script>
</body>
</html>
